<!DOCTYPE html>
<html>
<head>
    <title>Iniciar sesión - Gestor de Variables</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #F8F9FA;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            transition: background 0.3s ease;
        }
        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            position: relative;
        }
        .login-container:hover { transform: translateY(-2px); }
        .theme-toggle-login {
            position: absolute;
            top: 16px; right: 20px;
            background: transparent;
            border: 1px solid #DEE2E6;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            color: #212529;
            line-height: 1.4;
        }
        .theme-toggle-login:hover { background: #E9ECEF; }
        .login-header { text-align: center; margin-bottom: 32px; margin-top: 8px; }
        .login-header h1 {
            font-size: 1.8rem; font-weight: 700;
            color: #2C3E50; letter-spacing: -0.02em;
            transition: color 0.3s;
        }
        .login-header h1 span { color: #E72000; font-weight: 300; }
        .login-header p { color: #6C757D; font-size: 0.95rem; margin-top: 6px; transition: color 0.3s; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: 600;
            color: #2C3E50; margin-bottom: 6px;
            transition: color 0.3s;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f1f3f5;
            border-radius: 8px;
            transition: background 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 1px solid transparent;
        }
        .input-wrapper:focus-within {
            background: white;
            border-color: #E72000;
            box-shadow: 0 0 0 3px rgba(231,32,0,0.15);
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: transparent;
            font-size: 1rem;
            outline: none;
            font-family: inherit;
            color: #212529;
            transition: color 0.3s;
        }
        .input-wrapper input::placeholder { color: #adb5bd; }
        .toggle-password {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            cursor: pointer;
            color: #6C757D;
            padding: 6px;
            border-radius: 4px;
            transition: color 0.2s;
            line-height: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-password:hover { color: #212529; }
        .toggle-password svg {
            width: 20px; height: 20px;
            stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .error-message {
            background: #fff5f5;
            border-left: 4px solid #E72000;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #E72000;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .error-message::before { content: "⚠️"; font-size: 1.2rem; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #E72000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: inherit;
            letter-spacing: 0.02em;
        }
        .login-btn:hover { background: #cc1c00; }
        .login-btn:active { transform: scale(0.97); }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: #6C757D;
            transition: color 0.3s;
        }
        .login-footer a { color: #E72000; text-decoration: none; font-weight: 500; }
        .login-footer a:hover { text-decoration: underline; }

        body.dark-mode { background: #121212; }
        body.dark-mode .login-container { background: #1E1E2E; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
        body.dark-mode .login-container h1 { color: #EAEAEA; }
        body.dark-mode .login-container h1 span { color: #FF5533; }
        body.dark-mode .login-container p { color: #A0A0B0; }
        body.dark-mode .form-group label { color: #EAEAEA; }
        body.dark-mode .input-wrapper { background: #2A2A4A; border-color: #3A3A5A; }
        body.dark-mode .input-wrapper:focus-within {
            background: #1E1E2E; border-color: #FF5533;
            box-shadow: 0 0 0 3px rgba(255,85,51,0.25);
        }
        body.dark-mode .input-wrapper input { color: #EAEAEA; }
        body.dark-mode .input-wrapper input::placeholder { color: #808090; }
        body.dark-mode .toggle-password { color: #A0A0B0; }
        body.dark-mode .toggle-password:hover { color: #EAEAEA; }
        body.dark-mode .error-message { background: #3A1A1A; color: #FF7777; border-left-color: #FF5533; }
        body.dark-mode .login-btn { background: #FF5533; }
        body.dark-mode .login-btn:hover { background: #e64a2a; }
        body.dark-mode .login-footer { color: #A0A0B0; }
        body.dark-mode .login-footer a { color: #FF5533; }
        body.dark-mode .theme-toggle-login { border-color: #3A3A5A; color: #EAEAEA; }
        body.dark-mode .theme-toggle-login:hover { background: #2A2A4A; }

        @media (max-width: 480px) { .login-container { padding: 32px 24px; } }
    </style>
    <style>
        /* Tema SESNA: paleta unificada con la aplicación */
        body { background: #F6F2EA; font-family: 'Inter', system-ui, 'Segoe UI', sans-serif; }
        .login-container { border-radius: 16px; border: 1px solid #E9E6E1; border-top: 5px solid #C81045; box-shadow: 0 10px 40px rgba(25,27,31,.10); }
        .login-container:hover { transform: none; }
        .login-header h1 { color: #191B1F; font-size: 1.6rem; }
        .login-header h1 span { color: #C81045; font-weight: 600; }
        .login-header p { color: #4A4D53; font-size: 1rem; }
        .form-group label { color: #191B1F; font-size: .92rem; }
        .form-group input { min-height: 46px; border: 1px solid #DCD7CE; border-radius: 8px; background: #fff; color: #191B1F; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: #C81045; box-shadow: 0 0 0 3px rgba(200,16,69,.25); }
        .login-btn { min-height: 48px; background: #C81045; border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background .15s; }
        .login-btn:hover { background: #A60D39; }
        .login-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(200,16,69,.35); }
        .error-message { background: #F2B8C6; color: #6E1739; border: 1px solid #C81045; border-radius: 8px; padding: 10px 12px; font-weight: 500; }
        .login-footer { color: #4A4D53; }
        .theme-toggle-login { border-radius: 8px; border-color: #DCD7CE; }
        body.dark-mode { background: #131417; }
        body.dark-mode .login-container { background: #1C1E23; border-color: #33363D; border-top-color: #E8527A; }
        body.dark-mode .login-header h1 { color: #F6F2EA; }
        body.dark-mode .login-header h1 span { color: #E8527A; }
        body.dark-mode .login-header p, body.dark-mode .login-footer { color: #B4B6BB; }
        body.dark-mode .form-group label { color: #F6F2EA; }
        body.dark-mode .form-group input { background: #14161A; border-color: #33363D; color: #F6F2EA; }
        body.dark-mode .error-message { background: #2A1C23; color: #F2B8C6; border-color: #E8527A; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
    <style>
        .error-message::before { content: "warning" !important; font-family: 'Material Symbols Outlined'; font-feature-settings: 'liga'; font-size: 1.3rem; }
        .mi { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 400; display: inline-block; font-size: 1.4em; line-height: 1; vertical-align: -0.2em; font-feature-settings: 'liga'; visibility: hidden; }
        .icons-ready .mi { visibility: visible; }
        html:not(.icons-ready) .error-message::before { content: "!" !important; font-family: inherit; font-weight: 700; }
    </style>
    <style>
        /* Banda de marca: el logotipo es blanco, va sobre carbón */
        .login-container { padding-top: 0; overflow: hidden; }
        .login-brand { background: #191B1F; margin: 0 -40px 28px; padding: 26px 24px; display: flex; justify-content: center; }
        .login-brand img { height: 64px; width: auto; display: block; }
        .login-header { margin-top: 0 !important; }
        .theme-toggle-login { top: 12px !important; right: 14px !important; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.25) !important; color: #fff; }
        .theme-toggle-login:hover { background: rgba(255,255,255,.2) !important; }
        .theme-toggle-login .mi { color: #fff; }
        body.dark-mode .login-brand { background: #0E0F11; }
        @media (max-width: 480px) { .login-brand { margin: 0 -24px 22px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <button class="theme-toggle-login" id="darkModeToggleLogin" onclick="toggleDarkModeLogin()">🌙</button>
        <div class="login-brand"><img src="/static/img/logotipo_sesna.svg" alt="SESNA · Sistema Nacional Anticorrupción"></div>
        <div class="login-header">
            <h1>Gestor de Variables</h1>
            <p>Inicia sesión para continuar</p>
        </div>
        <form method="post">
            <div class="form-group">
                <label for="username">Usuario</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="ej. admin" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password"
                            onclick="togglePasswordVisibility()"
                            aria-label="Mostrar/ocultar contraseña">
                        <svg id="loginEyeOpen" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg id="loginEyeClosed" style="display:none;" viewBox="0 0 24 24">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>
            <!--ERROR-->
            <button type="submit" class="login-btn">Iniciar sesión</button>
        </form>
        <div class="login-footer">
            ¿Olvidaste tu contraseña? Contacta al administrador.
        </div>
    </div>
    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const eyeOpen = document.getElementById('loginEyeOpen');
            const eyeClosed = document.getElementById('loginEyeClosed');
            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                input.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }

        function toggleDarkModeLogin() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            const btn = document.getElementById('darkModeToggleLogin');
            btn.textContent = isDark ? '☀️' : '🌙';
        }

        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            const btn = document.getElementById('darkModeToggleLogin');
            if (btn) btn.textContent = '☀️';
        }
    </script>
    <script src="/static/js/icons.js"></script>
</body>
</html>
